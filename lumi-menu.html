<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03101f">
  <title>LUMI MENU | LUMINA-30</title>
  <script>
  (() => {
    const p = new URLSearchParams(location.search);
    const forced = p.get('lang');
    if (forced === 'ja' || forced === 'en') localStorage.setItem('l30-lumi-menu-lang', forced);
    const saved = localStorage.getItem('l30-lumi-menu-lang');
    const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    const detected = langs.some(v => String(v).toLowerCase().startsWith('ja')) ? 'ja' : 'en';
    const lang = (forced === 'ja' || forced === 'en') ? forced : ((saved === 'ja' || saved === 'en') ? saved : detected);
    try { if (document.referrer) sessionStorage.setItem('l30-lumi-menu-referrer', document.referrer); } catch (_) {}
    p.delete('lang');
    const query = p.toString();
    const target = lang === 'ja' ? 'lumi-menu-ja.html' : 'lumi-menu-en.html';
    location.replace(target + (query ? '?' + query : ''));
  })();
  </script>
  <style>html,body{min-height:100%;margin:0;background:#03101f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}a{color:#91dcff}</style>
</head>
<body><main><noscript><p>Please choose a language / 言語を選択してください</p><p><a href="lumi-menu-en.html">English</a> · <a href="lumi-menu-ja.html">日本語</a></p></noscript></main></body>
</html>
